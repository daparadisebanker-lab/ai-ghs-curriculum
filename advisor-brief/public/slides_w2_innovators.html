},

/* 5 — LESSON ACTIVITY — Hebb as framework (dark) */

  layout: "layout-activity", dark: true, title: "La regla de Hebb como marco",

      <div class="activity-step sos-body rv-step tn1">01 — La regla de Hebb (1949) describe este fenómeno.</div>
      <div class="activity-step sos-body rv-step tn2">02 — Cuando una red artificial aprende, ajusta el peso de las conexiones entre nodos.</div>
      <div class="activity-step sos-body rv-step tn3">03 — Igual que el cerebro ajusta la fuerza de las sinapsis con la práctica.</div>
      <div class="activity-step sos-body rv-step tn4">04 — No es una analogía poética: es la misma lógica de aprendizaje, en silicio en vez de biología.</div>
    </div>
  `

/* 6 — ARTIFACT — Deep Label — guitar chord 3-panel */

/* 7 — COMPARISON WALL — neurona vs nodo */
{
  layout: "layout-comparison", dark: false, title: "Neurona biológica vs. nodo de red",

/* 8 — PROMPT LAB — dark, 3 prompts */
{
  layout: "layout-prompt-lab", dark: true, title: "Laboratorio de prompts",

{
