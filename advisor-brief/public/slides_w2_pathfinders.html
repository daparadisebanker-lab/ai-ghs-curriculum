      <p class="sos-caption rv-label d4">Eso es lo que llamamos aprender.</p>

/* 5 — QUOTE — Reading Plate — Hebb 1949 */
{
  layout: "layout-reading-plate", dark: false, title: "Las neuronas que se activan juntas", hasQuote: true,
  html: `
    <div class="plate-inner">
      <div class="sos-kicker plate-kicker rv-label d1">LA REGLA, EN SIMPLE</div>
